<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0807"/>
      <stop offset="0.6" stop-color="#1a0d10"/>
      <stop offset="1" stop-color="#2a1216"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b86a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e8b86a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3e9d7" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f3e9d7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8975a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b8975a"/>
      <stop offset="1" stop-color="#b8975a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="winL"><path d="M70,300 V120 Q70,70 110,40 Q150,70 150,120 V300 Z"/></clipPath>
    <clipPath id="winR"><path d="M750,300 V120 Q750,70 790,40 Q830,70 830,120 V300 Z"/></clipPath>
  </defs>

  <rect width="900" height="330" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#f3e9d7">
    <circle cx="230" cy="48" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="90" r="1"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="370" cy="36" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="44" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="80" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="40" r="1"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="24" r="1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="280" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="290" r="1.2"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- left window: moon -->
  <g>
    <path d="M70,300 V120 Q70,70 110,40 Q150,70 150,120 V300 Z" fill="#10131f"/>
    <g clip-path="url(#winL)">
      <circle cx="110" cy="130" r="60" fill="url(#moonGlow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="130" r="26" fill="#f3e9d7"/>
      <circle cx="122" cy="122" r="24" fill="#10131f"/>
      <path d="M70,300 L70,250 L90,250 L90,230 L110,230 L110,255 L150,255 L150,300 Z" fill="#06080f"/>
    </g>
    <path d="M70,300 V120 Q70,70 110,40 Q150,70 150,120 V300 Z" fill="none" stroke="#b8975a" stroke-width="2.5"/>
    <path d="M110,40 V300 M70,150 H150" stroke="#b8975a" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- right window: candlelight -->
  <g>
    <path d="M750,300 V120 Q750,70 790,40 Q830,70 830,120 V300 Z" fill="#1b0e0c"/>
    <g clip-path="url(#winR)">
      <circle cx="790" cy="200" r="90" fill="url(#glow)">
        <animate attributeName="opacity" values="0.4;0.95;0.55;1;0.45" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="r" values="80;96;84;98;82" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <rect x="780" y="215" width="20" height="70" rx="2" fill="#d9c9a8"/>
      <path d="M790,175 Q780,198 790,213 Q800,198 790,175 Z" fill="#ffd27a">
        <animateTransform attributeName="transform" type="scale" values="1 1;1.1 0.88;0.94 1.08;1 1" dur="1.4s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="1;0.75;1;0.85;1" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M750,300 V120 Q750,70 790,40 Q830,70 830,120 V300 Z" fill="none" stroke="#b8975a" stroke-width="2.5"/>
    <path d="M790,40 V300 M750,150 H830" stroke="#b8975a" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- dust motes -->
  <g fill="#e8b86a">
    <circle cx="200" cy="280" r="1.5"><animate attributeName="cy" values="290;60" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="300" r="1.2"><animate attributeName="cy" values="300;80" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="290" r="1.6"><animate attributeName="cy" values="300;50" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="300" r="1.1"><animate attributeName="cy" values="300;90" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="285" r="1.4"><animate attributeName="cy" values="295;70" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="15s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="450" y="112" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="7" fill="#b8975a" opacity="0">
    EX LIBRIS
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="2s" fill="freeze"/>
  </text>
  <text x="450" y="178" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="54" font-style="italic" letter-spacing="3" fill="#f3e9d7" opacity="0">
    Betül Pehlivan
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="2.2s" fill="freeze"/>
  </text>
  <rect x="270" y="196" width="360" height="1.5" fill="url(#goldLine)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="2s" fill="freeze"/>
  </rect>
  <text x="450" y="228" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="4" fill="#9fae96" opacity="0">
    COMPUTER ENGINEER · DATA · MACHINE LEARNING
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="2s" fill="freeze"/>
  </text>
  <text x="450" y="262" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#c6a56b" opacity="0">
    per aspera ad astra
    <animate attributeName="opacity" values="0;0.5;1;0.5" begin="3s" dur="5s" repeatCount="indefinite"/>
  </text>
</svg>
